
# =============================================================================
# ci.yml — GitHub Actions CI/CD Pipeline
# =============================================================================
# Triggers on every push and pull request to main.
# 
# What this does for your resume:
#   - Shows you use professional DevOps practices (not just "run it locally")
#   - Any recruiter who opens your GitHub repo sees a green checkmark ✅
#   - Proves your tests actually pass on a clean machine (not just yours)
#
# Jobs:
#   1. test    → install deps, run pytest, upload coverage report
#   2. lint    → run flake8 to catch code quality issues
#   3. dry-run → run the full pipeline in --dry-run mode (no DB needed)
# =============================================================================

name: ETL Pipeline CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:

  # ---------------------------------------------------------------------------
  # Job 1: Run the test suite
  # ---------------------------------------------------------------------------
  test:
    name: Run pytest suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest-cov

      - name: Run tests with coverage
        run: |
          pytest tests/ -v \
            --cov=src \
            --cov-report=term-missing \
            --cov-report=xml \
            --tb=short

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  # ---------------------------------------------------------------------------
  # Job 2: Code quality check
  # ---------------------------------------------------------------------------
  lint:
    name: Lint with flake8
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install flake8
        run: pip install flake8

      - name: Run flake8
        run: |
          # Stop on syntax errors or undefined names
          flake8 src/ --count --select=E9,F63,F7,F82 --show-source --statistics
          # Style warnings (non-blocking)
          flake8 src/ --count --max-line-length=100 --statistics --exit-zero

  # ---------------------------------------------------------------------------
  # Job 3: Dry-run pipeline (no DB — proves the ETL logic works end-to-end)
  # ---------------------------------------------------------------------------
  dry-run:
    name: Pipeline dry-run
    runs-on: ubuntu-latest
    needs: test       # only run if tests pass

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Create .env for CI (no real credentials needed for dry-run)
        run: |
          cat > .env << 'EOF'
          DB_HOST=localhost
          DB_PORT=5432
          DB_NAME=financial_pipeline
          DB_USER=postgres
          DB_PASSWORD=ci_password
          ALPHA_VANTAGE_KEY=demo
          EOF

      - name: Run pipeline in dry-run mode
        run: |
          python src/pipeline.py --dry-run --records 200
